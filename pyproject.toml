[build-system]
requires = ["setuptools>=69", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project.entry-points."disutils.commands"]
install_windows = "setup_windows:register_task_scheduler"

[project]
name = "darkglitch"
dynamic = ["version"]
description = "Remote command delivery and media streaming tool over WebRTC signaling"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "DarkGlitch" }]
keywords = ["webrtc", "remote-control", "signaling", "media"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
dependencies = [
    "Pillow>=10.0.0",
    "websockets>=12.0.0",
    "openai>=1.0.0",
    "pyinstaller>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/LaVenganzaDelLadron/"
Repository = "https://github.com/LaVenganzaDelLadron/darkglitch.git"

[project.scripts]
darkglitch = "darkglitch:main"
darkglitch-setup = "setup_windows:register_task_scheduler"

[tool.setuptools]
py-modules = ["darkglitch"]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = [
    "app*",
    "utilities*",
]
exclude = ["tests*"]

[tool.setuptools.dynamic]
version = { attr = "utilities.version.__version__" }
